# PostgreSQL lokal untuk development. Produksi: lihat docs/architecture.md (ADR-002).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paskam
      POSTGRES_PASSWORD: paskam
      POSTGRES_DB: paskam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
